<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Generalboi Threads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#101010;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:520px;margin:auto;padding:28px 18px 48px}.brand{font-size:13px;color:#aaa;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:32px;margin:10px 0 6px} .sub{color:#aaa;line-height:1.5;margin:0 0 26px}
    .panel{background:#1b1b1b;border:1px solid #303030;border-radius:18px;padding:18px;margin:14px 0}
    button{width:100%;border:0;border-radius:999px;padding:15px 18px;font-weight:700;font-size:15px;background:#f5f5f5;color:#111}
    button.secondary{background:#292929;color:#fff;border:1px solid #444}
    button:disabled{opacity:.45}.account{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #333}
    .account:last-child{border:0}.username{font-weight:650}.muted{color:#999;font-size:13px;margin-top:4px}
    .account button{width:auto;padding:9px 14px;font-size:13px}.status{font-size:14px;color:#bbb;line-height:1.5;white-space:pre-wrap}
    .error{color:#ff8c8c}.success{color:#9be0a6}.hidden{display:none}
    footer{color:#777;font-size:12px;line-height:1.5;text-align:center;margin-top:28px}
  </style>
</head>
<body>
<main>
  <div class="brand">Generalboi Mini App</div>
  <h1>Threads</h1>
  <p class="sub">Connect your Threads accounts and switch between them here.</p>
  <section class="panel">
    <button id="connect">＋ Connect a Threads account</button>
    <p id="status" class="status" role="status">Checking Telegram session…</p>
  </section>
  <section class="panel">
    <h2 style="font-size:18px;margin:0 0 8px">Your accounts</h2>
    <div id="accounts"><p class="status">Your linked accounts will appear here.</p></div>
  </section>
  <footer>Sign-in is handled by Threads. Your access tokens stay on the secure server and are not stored in this page.</footer>
</main>
<script src="./threads.js"></script>
</body>
</html>
